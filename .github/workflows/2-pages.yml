name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static prerender for the Pages project site at
      # https://brightmann.github.io/blog-home-nuxt/
      # NUXT_APP_BASE_URL prefixes routes/assets; VITE_NUXT_API_PREFIX points
      # the mock API under the same base so prerender SSR fetches resolve.
      - name: Generate static site
        run: npx nuxt generate --dotenv .env.production
        env:
          NUXT_APP_BASE_URL: /blog-home-nuxt/
          VITE_NUXT_API_PREFIX: /blog-home-nuxt/x-blog/api/v1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
